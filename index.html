<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine App</title>
    <meta name="theme-color" content="#ffffff">
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/search-doc.css">
    <link rel="stylesheet" href="css/checklist.css">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/img-192x192.png">
</head>
<body>

    <!-- ==========================================
         MODUL 1: ArbeitsSafe
         ========================================== -->
    <div id="module-arbeitssafe" class="app-module active">
        <main class="workspace-container">
            
            <!-- HIER KOMMT DEIN KOMPLETTER BISHERIGER ARBEITSSAFE-CODE REIN -->
            <!-- Von <header class="card-base tool-header"> ... bis ... </section> -->
            
        </main>
    </div>

    <!-- ==========================================
         MODUL 2: Einkauf
         ========================================== -->
    <div id="module-einkauf" class="app-module">
        <main class="workspace-container">
            <header class="card-base tool-header">
                <div class="header-titles">
                    <h1>Einkaufsliste</h1>
                    <p>Smarte Organisation für den nächsten Einkauf.</p>
                </div>
            </header>
            <div class="empty-state card-base">
                <p class="bold-text">Einkaufs-Modul</p>
                <p>Hier entsteht die neue Einkaufsliste.</p>
            </div>
        </main>
    </div>

    <!-- ==========================================
         MODUL 3: Essensplan
         ========================================== -->
    <div id="module-essen" class="app-module">
        <main class="workspace-container">
            <header class="card-base tool-header">
                <div class="header-titles">
                    <h1>Essensplan</h1>
                    <p>Wochenplanung leicht gemacht.</p>
                </div>
            </header>
            <div class="empty-state card-base">
                <p class="bold-text">Meal-Planer-Modul</p>
                <p>Hier entsteht der Essensplan.</p>
            </div>
        </main>
    </div>

    <!-- ==========================================
         GLOBALE BOTTOM NAVIGATION (Daumen-Zone)
         ========================================== -->
    <nav class="bottom-nav-bar">
        <button class="module-btn active" data-module="module-arbeitssafe">
            <span class="icon" aria-hidden="true">🛡️</span>
            <span class="label">ArbeitsSafe</span>
        </button>
        <button class="module-btn" data-module="module-einkauf">
            <span class="icon" aria-hidden="true">🛒</span>
            <span class="label">Einkauf</span>
        </button>
        <button class="module-btn" data-module="module-essen">
            <span class="icon" aria-hidden="true">🍽️</span>
            <span class="label">Essensplan</span>
        </button>
    </nav>

    <!-- Overlays und Scripte (wie bisher) -->
    <!-- ... -->

</body>
</html>
