<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisionsschreiben Tool</title>
    
    <!-- Ausgelagertes CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="workspace-container">
        <header class="card-base tool-header">
            <div class="header-titles">
                <h1>Revisionsschreiben Tool</h1>
                <p>Generator für rechtssichere Textbausteine</p>
            </div>
            <div class="header-right">
                <div id="statusBadge" class="status-badge"><span>⚠️</span><span id="statusText">Demo-Modus</span></div>
                <button type="button" id="reloadBtn" class="btn btn-tool btn-secondary">🔄 Neu laden</button>
                <div class="upload-wrapper">
                    <button type="button" class="btn btn-tool btn-primary">📁 CSV laden</button>
                    <input type="file" id="csvFileInput" accept=".csv">
                </div>
            </div>
        </header>

        <div id="errorContainer"></div>

        <div class="workspace-layout">
            <div class="main-content-area">
                <div class="card-base controls-toolbar">
                    <div class="control-field">
                        <label>1. Gesetz</label>
                        <select id="lawFilter"><option value="">-- Alle --</option></select>
                    </div>
                    <div class="control-field">
                        <label>2. Paragraf</label>
                        <select id="paragraphFilter"><option value="">-- Alle --</option></select>
                    </div>
                    <div class="control-field">
                        <label>3. Absatz</label>
                        <select id="absatzFilter" disabled><option value="">-- Alle --</option></select>
                    </div>
                    <div class="control-field search-full-width">
                        <label>4. Globale Textsuche</label>
                        <input type="text" id="searchInput" placeholder="Suchbegriff eingeben (z.B. Lärm, Gefährdung)...">
                    </div>
                    <div>
                        <label class="filter-checkbox-wrapper">
                            <input type="checkbox" id="hasBausteinFilter"> Nur Einträge mit Textbaustein
                        </label>
                    </div>
                </div>

                <div id="results" class="results-container">
                    <div class="card-base no-results">Wählen Sie oben Kriterien aus oder nutzen Sie die Textsuche.</div>
                </div>
            </div>

            <aside class="document-view">
                <div class="doc-header">
                    <h3>Entwurf: Revisionsschreiben</h3>
                    <span id="schreibenCounter" class="counter-badge">0 Punkte</span>
                </div>

                <div id="schreibenList" class="doc-items-list">
                    <div class="doc-empty">
                        Das Schreiben ist noch leer.<br><br>
                        Suchen Sie links nach Paragrafen und klicken Sie auf <strong>„➕ Zum Schreiben“</strong>.
                    </div>
                </div>

                <div class="doc-footer">
                    <button type="button" id="copySchreibenBtn" class="btn btn-tool btn-success" style="flex: 2; padding: 1rem; font-size: 1.1rem;" onclick="copyComposedSchreiben()" disabled>
                        📋 Dokument kopieren
                    </button>
                    <button type="button" id="clearSchreibenBtn" class="btn btn-tool btn-secondary" style="flex: 1; display:none;" onclick="clearSchreiben()">
                        🗑️ Leeren
                    </button>
                </div>
            </aside>
        </div>
    </main>

    <!-- Ausgelagertes JavaScript als Modul -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
